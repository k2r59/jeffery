name: WatchCoach
options:
  bundleIdPrefix: dev.promo
  deploymentTarget:
    iOS: "27.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Renseigne ton Team ID Apple ici (ou dans Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: PTB959SX83
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WatchCoach:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: LiveActivity
    dependencies:
      - target: WatchCoachWatch
      - target: JeffreyWidgets
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Jeffrey
        UILaunchScreen:
          UIColorName: JeffreyEncre
          UIImageName: jeffrey-symbole-citron
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: "Jeffrey enregistre le tracé GPS de ta séance et calcule distance et allure si la montre ne les fournit pas."
        NSAppleMusicUsageDescription: "Jeffrey affiche le titre en cours et te laisse le mettre en pause ou passer au suivant pendant la séance."
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMotionUsageDescription: "Jeffrey détecte si tu marches, cours ou t'arrêtes, ta cadence et le relief, pour réagir au bon moment."
        NSMicrophoneUsageDescription: "Jeffrey t'écoute pour dialoguer avec toi pendant la séance."
        NSSpeechRecognitionUsageDescription: "En mode Apple AI, Jeffrey comprend ce que tu dis directement sur l'iPhone, sans envoyer ta voix à un serveur."
        NSHealthShareUsageDescription: "Jeffrey lit tes données d'entraînement pour te coacher en direct."
        NSHealthUpdateUsageDescription: "Jeffrey peut lancer une séance sur ta montre."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [spotify, deezer, music, youtubemusic, soundcloud]
    entitlements:
      path: iOS/WatchCoach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.promo.watchcoach
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: iOS/ObjC/WatchCoach-Bridging-Header.h
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  WatchCoachWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Shared
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Jeffrey
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.promo.watchcoach
        WKRunsIndependentlyOfCompanionApp: false
        # workout-processing : mode piloté ; physical-therapy : session étendue du mode compagnon.
        WKBackgroundModes: [workout-processing, physical-therapy]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: "Jeffrey enregistre le tracé GPS des séances qu'il pilote en extérieur."
        NSHealthShareUsageDescription: "Jeffrey lit fréquence cardiaque, distance et calories pendant la séance."
        NSHealthUpdateUsageDescription: "Jeffrey enregistre la séance dans Santé quand il la pilote."
    entitlements:
      path: WatchApp/WatchCoachWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.promo.watchcoach.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  JeffreyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: LiveActivity
      - path: Shared/MetricsSnapshot.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Jeffrey
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.promo.watchcoach.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  WatchCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: WatchCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.promo.watchcoach.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WatchCoach.app/WatchCoach
        BUNDLE_LOADER: $(TEST_HOST)

  WatchCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: WatchCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.promo.watchcoach.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WatchCoach

schemes:
  WatchCoach:
    build:
      targets:
        WatchCoach: all
        WatchCoachTests: [test]
        WatchCoachUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WatchCoachTests
        - WatchCoachUITests
  WatchCoachWatch:
    build:
      targets:
        WatchCoachWatch: all
    run:
      config: Debug

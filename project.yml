name: WatchCoach
options:
  bundleIdPrefix: dev.promo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Renseigne ton Team ID Apple ici (ou dans Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: PTB959SX83
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WatchCoach:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    dependencies:
      - target: WatchCoachWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: WatchCoach
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: "WatchCoach enregistre le tracé GPS de ta séance et calcule distance et allure si la montre ne les fournit pas."
        NSMicrophoneUsageDescription: "WatchCoach écoute ta voix pour dialoguer avec le coach pendant la séance."
        NSHealthShareUsageDescription: "WatchCoach lit tes données d'entraînement pour le coaching en direct."
        NSHealthUpdateUsageDescription: "WatchCoach peut lancer une séance sur ta montre."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOS/WatchCoach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.promo.watchcoach
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  WatchCoachWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Shared
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: WatchCoach
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.promo.watchcoach
        WKRunsIndependentlyOfCompanionApp: false
        # workout-processing : mode piloté ; physical-therapy : session étendue du mode compagnon.
        WKBackgroundModes: [workout-processing, physical-therapy]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: "WatchCoach enregistre le tracé GPS des séances qu'il pilote en extérieur."
        NSHealthShareUsageDescription: "WatchCoach lit fréquence cardiaque, distance et calories pendant la séance."
        NSHealthUpdateUsageDescription: "WatchCoach enregistre la séance dans Santé quand il la pilote."
    entitlements:
      path: WatchApp/WatchCoachWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.promo.watchcoach.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""

schemes:
  WatchCoach:
    build:
      targets:
        WatchCoach: all
    run:
      config: Debug
  WatchCoachWatch:
    build:
      targets:
        WatchCoachWatch: all
    run:
      config: Debug
